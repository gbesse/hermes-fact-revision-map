[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fact-revision-map"
version = "0.1.0a1"
description = "FR: Préparer les corrections dépendant de versions de faits | EN: Prepare corrections tied to specific fact revisions | ES: Preparar correcciones ligadas a revisiones de hechos"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
hermes-fact-revision-map = "hermes_fact_revision_map.__main__:main"

[tool.setuptools.packages.find]
include = ["hermes_fact_revision_map*"]
